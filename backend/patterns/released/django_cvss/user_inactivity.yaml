  - id: user_inactivity
    description: >-
      User Inactivity is detected and handled properly
    type: RegexAnd
    pattern:
      - ^\s*SESSION_COOKIE_AGE\s*=\s*.*?\s*$
      - ^\s*SESSION_SAVE_EVERY_REQUEST\s*=\s*True\s*$
      - ^\s*SESSION_EXPIRE_AT_BROWSER_CLOSE\s*=\s*True
      - request\.session\.\w+\(\)
      - class\s+\w+\(SessionMiddleware\)\s*
      - ^\s*SESSION_COOKIE_HTTPONLY\s*=\s*True
      - ^\s*SESSION_COOKIE_SECURE\s*=\s*True
      - SessionTimeoutMiddleware
      - auto_logout
      - last_touch
      - last_activity
      - \django\.contrib\.sessions\.middleware\.SessionMiddleware
    vulnerability_impacts:
      - vulnerability_id: insufficient_authorization
        severity: "moderate"
        relative_impacts: []

    manual_check: true
    severity: warning
