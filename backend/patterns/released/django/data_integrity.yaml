  - id: authorization_for_data
    description: >-
      This Application implements authorization to access sensitive resources.
    type: RegexAnd
    pattern:
      - \@permission_required\(
      - \.has_perm\(
    vulnerability_impacts:
      - vulnerability_id: inadequate_data_security
        severity: "moderate"
        relative_impacts: []
    manual_check: true
    severity: warning

  - id: authorization_exception
    description: >-
      This Application implements authorization to destroy sensitive resources.
    type: RegexAnd
    pattern:
      - PermissionDenied
      - PermissionRequiredMixin
    vulnerability_impacts:
      - vulnerability_id: inadequate_data_security
        severity: "moderate"
        relative_impacts: []
    manual_check: true
    severity: warning

  - id: database_migration
    description: >-
      This Application uses database migration to define schema and uses primary keys to enforce data integrity.
    type: RegexAnd
    pattern:
      - migrations\.Migration
      - migrations\.
    vulnerability_impacts:
      - vulnerability_id: inadequate_data_security
        severity: "moderate"
        relative_impacts: []
    manual_check: true
    severity: warning

  - id: data_validation
    description: >-
      This Application implements data validation rules in order to ensure valid data.
    type: RegexAnd
    pattern:
      - validators
      - ValidationError
      - MinValueValidator
      - MaxValueValidator
      - RegexValidator
      - DecimalValidator
      - EmailValidator
      - URLValidator
      - FileExtensionValidator
      - MaxLengthValidator
      - MinLengthValidator
      - BaseValidator
      - FieldError
    vulnerability_impacts:
      - vulnerability_id: inadequate_data_security
        severity: "minor"
        relative_impacts: []
    manual_check: true
    severity: warning

  - id: database_transaction
    description: >-
      This Application uses database transactions in order to prevent data from partial updates that could compromise data integrity.
    type: RegexAnd
    pattern:
      - transaction.atomic\(
      - \@transation.atomic
    vulnerability_impacts:
      - vulnerability_id: inadequate_data_security
        severity: "moderate"
        relative_impacts: []
    manual_check: true
    severity: warning

  - id: error_handling
    description: >-
      This Application handles errors to identify and address faulty or invalid data.
    type: RegexAnd
    pattern:
      - ValidationError
      - IntegrityError
      - DatabaseError
      - OperationalError
      - InternalError
      - ProgrammingError
      - InterfaceError
      - NotSupportedError
      - raise\s+\w+Exception\(
      - raise\s+HttpResponseForbidden\(
      - raise\s+SuspiciousOperation\(
    vulnerability_impacts:
      - vulnerability_id: inadequate_data_security
        severity: "negligible"
        relative_impacts: []
    manual_check: true
    severity: warning
