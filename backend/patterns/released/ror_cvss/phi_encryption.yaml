  - id: data_encryption_phi
    description: >-
      Encryption via AES symmetric encryption algorithm
    pattern:
      - has_encrypted
      - ^attr_encrypted\s*:\s*\w+
      - ^encrypts\s*:\s*\w+
      - encrypted\s*:\s*true
