  - id: user_inactivity
    description: >-
      User Inactivity Or auto log off is detected and handled properly
    type: RegexAnd
    pattern:
      - :timeoutable
      - \.timeout_in\s*=\s*
    vulnerability_impacts:
      - vulnerability_id: insufficient_authorization
        severity: "moderate"
        relative_impacts: []

    manual_check: false
    severity: warning
