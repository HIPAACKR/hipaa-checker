  - id: user_inactivity
    description: >-
      User Inactivity is detected and handled properly
    type: RegexAnd
    pattern:
      - lifetime
      - expire_on_close
      - Session::flush\(
      - lastActivityTime
      - inactivity
      - resetInactivityTimer
      - AuthTimeoutMiddleware
      - inactivityTimeout
      - AuthTimeout
      - CheckAuthTimeout
      - AuthTimedOut
    vulnerability_impacts:
      - vulnerability_id: insufficient_authorization
        severity: "strong"
        relative_impacts: []
    manual_check: false
    severity: warning
