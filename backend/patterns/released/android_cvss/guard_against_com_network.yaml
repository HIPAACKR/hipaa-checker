  - id: trusted_server_communication
    description: >-
      Unauthorized access to PHI that is being transmitted over communications network is restricted.
    type: RegexAnd
    pattern:
      - TrustManagerFactory\.getInstance
      - TrustManager
    vulnerability_impacts:
      - vulnerability_id: insecure_network_communication
        severity: "strong"
        relative_impacts:
          - subrule_id: strict_hostname_validation
            factor: "negligible"
    manual_check: false
    severity: 0
    weight: 1
    score: 5

  - id: insecure_server_communication
    description: >-
      This App could potentially bypass secure defaults, making it critical to review for vulnerabilities like insecure SSL/TLS configurations..
    type: RegexAnd
    pattern:
      - setDefaultSSLSocketFactory
    vulnerability_impacts:
      - vulnerability_id: insecure_network_communication
        severity: "negative_moderate"
        relative_impacts:
          - subrule_id: secured_url_data_transmission
            factor: "minor"
    manual_check: false
    severity: 0
    weight: 1
    score: 5

  - id: server_certificate_pinning
    description: >-
      This App uses CertificatePinner to implement certificate pinning.
    type: RegexAnd
    pattern:
      - CertificatePinner\.Builder
    vulnerability_impacts:
      - vulnerability_id: insecure_network_communication
        severity: "strong"
        relative_impacts: []
    manual_check: false
    severity: 0
    weight: 1
    score: 5

  - id: disabled_certificate_validation
    description: >-
      This App may disable SSL/TLS certificate validation, potentially exposing the app to Man-in-the-Middle (MITM) attacks by trusting all certificates.
    type: RegexAnd
    pattern:
      - trustAllHosts
    vulnerability_impacts:
      - vulnerability_id: insecure_network_communication
        severity: "negative_strong"
        relative_impacts:
          - subrule_id: trusted_server_communication
            factor: "minor"
          - subrule_id: server_certificate_pinning
            factor: "minor"
    manual_check: false
    severity: 0
    weight: 1
    score: 5

  - id: custom_ssl_validation
    description: >-
      This App uses a custom SSL validation approach with TrustManager and SSLContext
      for handling certificate validation
    pattern:
      - SSLContext\.getInstance\("TLS
      - setSSLSocketFactory
    vulnerability_impacts:
      - vulnerability_id: insecure_network_communication
        severity: "strong"
        relative_impacts: []
    manual_check: false
    severity: 0
    weight: 1
    score: 5

  - id: disabled_hostname_verification
    description: >-
      This App bypasses hostname verification and introduces security vulnerabilities.
    type: RegexAnd
    pattern:
      - HttpsURLConnection\.setDefaultHostnameVerifier\(\(hostname,\s*session\)\s*->\s*true\s*\)
    vulnerability_impacts:
      - vulnerability_id: insecure_network_communication
        severity: "negative_moderate"
        relative_impacts:
          - subrule_id: strict_hostname_validation
            factor: "negligible"
          - subrule_id: trusted_server_communication
            factor: "minor"
    manual_check: false
    severity: 0
    weight: 1
    score: 5

  - id: strict_hostname_validation
    description: >-
      This App ensures that only strict hostname validation is allowed, thereby helping to prevent vulnerabilities such as Man-in-the-Middle (MITM) attacks.
    type: RegexAnd
    pattern:
      - HttpsURLConnection\.setDefaultHostnameVerifier\(\(hostname,\s*session\)\s*->\s*["']?\w+["']?\.equalsIgnoreCase\(\s*hostname\s*\)\s*\)
    vulnerability_impacts:
      - vulnerability_id: insecure_network_communication
        severity: "minor"
        relative_impacts: []
    manual_check: true
    severity: 0
    weight: 1
    score: 5

  - id: secured_webview_communication
    description: >-
      This application checks the secure webview communication.
    type: RegexAnd
    pattern:
      - getSettings\(\)\.setJavaScriptEnabled\(\s*true\s*\)
      - setWebViewClient\(new\s+SecureWebViewClient\(\)\)
    vulnerability_impacts:
      - vulnerability_id: insecure_network_communication
        severity: "moderate"
        relative_impacts:
          - subrule_id: secured_webview_content
            factor: "negligible"
    manual_check: true
    severity: 0
    weight: 1
    score: 5

  - id: secured_webview_content
    description: >-
      This App disables mixed content mode for WebView to prevent insecure content.
    type: RegexAnd
    pattern:
      - WebSettings\.MIXED_CONTENT_NEVER_ALLOW
      - setMixedContentMode\(WebView.MIXED_CONTENT_NEVER_ALLOW
    vulnerability_impacts:
      - vulnerability_id: insecure_network_communication
        severity: "minor"
        relative_impacts: []
    manual_check: true
    severity: 0
    weight: 1
    score: 5


