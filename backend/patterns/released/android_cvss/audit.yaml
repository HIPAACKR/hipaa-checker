  - id: data_access_audit
    description: >-
      This app monitors insights into how app and its dependencies access private data from users by performing data access auditing.
    type: RegexAnd
    pattern:
      - AppOpsManager\.OnOpNotedCallback
      - (ContentProvider|ContentResolver)\.query\(
      - (onRequestPermissionsResult|checkSelfPermission)
    vulnerability_impacts:
      - vulnerability_id: inconsistent_audit_trail
        severity: "none"
        relative_impacts: []
    manual_check: true
    severity: 0
    weight: 1
    score: 5
    url: https://developer.android.com/guide/topics/data/audit-access

