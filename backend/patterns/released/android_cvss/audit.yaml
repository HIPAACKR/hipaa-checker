  - id: user_event_tracking_audit
    description: >-
      This app tracks user actions, ensuring critical operations are logged for accountability.
    type: RegexAnd
    pattern:
      - logEvent\(
      - FirebaseAnalytics\.Param\.SCREEN_NAME
      - FirebaseAnalytics\.Param\.SCREEN_CLASS
      - FirebaseAnalytics\.Event\.SCREEN_VIEW
    #- (FirebaseAnalytics|MixpanelAPI|Amplitude|NewRelic|Bugfender|Sentry|AppDynamics)\.(logEvent|track|recordBreadcrumb|setAttribute|captureMessage|addData)\(.*(app_launch|user_login|user_logout|foreground|background|login|logout).*\\?.*\)
      - (FirebaseAnalytics|MixpanelAPI|Amplitude|NewRelic|Bugfender|Sentry|AppDynamics)\.(logEvent|track|recordBreadcrumb|setAttribute|captureMessage|addData)
    vulnerability_impacts:
      - vulnerability_id: inconsistent_audit_trail
        severity: "optimal"
        relative_impacts: []
    manual_check: false
    severity: 0
    weight: 1
    score: 5
    url: https://developer.android.com/guide/topics/data/audit-access

  - id: application_life_cycle_audit
    description: >-
      This app tracks the application life cycle and states to monitor the application.
    type: RegexAnd
    pattern:
      - ActivityLifecycleCallbacks\.(onActivityResumed|onActivityPaused|onActivityStarted|onActivityStopped|onActivityCreated|onActivityDestroyed)\(
    vulnerability_impacts:
      - vulnerability_id: inconsistent_audit_trail
        severity: "negligible"
        relative_impacts: []
    manual_check: true
    severity: 0
    weight: 1
    score: 5
    url: https://developer.android.com/guide/topics/data/audit-access

  - id: application_performance_audit
    description: >-
      This app implements standard app performance monitoring, crash and error reporting for auditing.
    type: RegexAnd
    pattern:
      - FirebaseCrashlytics\.getInstance\(\)\.setCrashlyticsCollectionEnabled\(true
      - FirebaseCrashlytics\.getInstance\(\)\.recordException\(
      - FirebasePerformance\.getInstance\(\)\.newTrace\(
    vulnerability_impacts:
      - vulnerability_id: inconsistent_audit_trail
        severity: "minor"
        relative_impacts: []
    manual_check: false
    severity: 0
    weight: 1
    score: 5
    url: https://developer.android.com/guide/topics/data/audit-access

