- id: data_encryption
  description: >-
    Encryption via the OpenSSL and the AES-256-CBC cipher is present
  pattern:
    - Crypt::encryptString\(
    - encrypt\(
  vulnerability_impacts:
    - vulnerability_id: inadequate_data_security
      severity: "optimal"
      relative_impacts: []
  severity: warning

- id: data_dycription
  description: >-
    Data decryption is used properly using the Cryptography
  pattern:
    - Crypt::decryptString\(
    - decrypt\(
  vulnerability_impacts:
    - vulnerability_id: inadequate_data_security
      severity: "optimal"
      relative_impacts: []
  severity: warning


