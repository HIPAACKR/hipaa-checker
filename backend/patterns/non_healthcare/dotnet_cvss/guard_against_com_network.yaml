- id: user_authentication_jwt_for_network_security
  description: >-
    Checks whether authentication is implemented using JSON Web Tokens (JWT).
  type: RegexAnd
  pattern:
    - \.AddJwtBearer\(
    - JwtBearerDefaults\(
    - \w+\.UseJwtBearerAuthentication\(new\s+JwtBearerAuthenticationOptions
    - \w+\.DefaultAuthenticateScheme\s*\=\s*JwtBearerDefaults\.AuthenticationScheme
    - AddApiKey\(
    - X-Api-Key
    - Request\.Headers\[\"Authorization\"\]
    - SecurityTokenExpiredException
  severity: 0
  vulnerability_impacts:
    - vulnerability_id: insecure_network_communication
      severity: "strong"
      relative_impacts:
        - subrule_id: user_authentication_cookie_for_network_security
          factor: "minor"

- id: user_authentication_cookie_for_network_security
  description: >-
    Checks whether authentication is implemented using cookies.
  type: RegexAnd
  pattern:
    - \.AddAuthentication\(
    - \.AddCookie\(
    - CookieAuthenticationDefaults\(
  severity: 0
  vulnerability_impacts:
    - vulnerability_id: insecure_network_communication
      severity: "optimal"
      relative_impacts:
        - subrule_id: user_authentication_jwt_for_network_security
          factor: "negligible"
