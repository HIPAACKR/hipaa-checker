- id: optimal_https
  description: >-
    Ensures secure handling of authentication tokens and credentials.
  type: RegexAnd
  pattern:
    - import\s+io\.jsonwebtoken\.Jwts
    - .setSigningKey\(
    - .parseClaimsJws\(
    - .TokenProvider\(
    - HTTPS
    - (?i)Secure\s*HttpOnly
    - (?i)Strict-Transport-Security
    - TLSv1\.(2|3)
    - (?i)Content-Security-Policy
    - \@WebFilter(
    - \.setFilter\(new ContentSecurityPolicyFilter\(\)
  vulnerability_impacts:
    - vulnerability_id: insecure_network_communication
      severity: "optimal"
      relative_impacts:
        - subrule_id: strong_transmission_security
          factor: "negligible"
        - subrule_id: weak_transmission_security
          factor: "minor"
        - subrule_id: weakest_transmission_security
          factor: "minor"
  severity: 0
  weight: 1
  score: 5

- id: strong_transmission_security
  description: >-
    Detects weak SSL protocols (TLS 1.0, TLS 1.1).
  type: RegexAnd
  pattern:
    - (TLSv1|TLSv1\.1)
    - TLSv1\.(0|1)
    - (?i)X-Content-Type-Options
  vulnerability_impacts:
    - vulnerability_id: insecure_network_communication
      severity: "strong"
      relative_impacts:
        - subrule_id: https
          factor: "moderate"
        - subrule_id: weak_transmission_security
          factor: "minor"
        - subrule_id: weakest_transmission_security
          factor: "minor"
  severity: 0
  weight: 1
  score: 5

- id: weak_transmission_security
  description: >-
    Ensures encrypted data transmission.
  type: RegexAnd
  pattern:
    - SSLContext\.getInstance\(
    - HTTP
    - (?i)SSLv3
    - (?i)Cookie\s*[^;]*Secure\s*=\s*false
    - (?i)X-XSS-Protection\s*=\s*0
  vulnerability_impacts:
    - vulnerability_id: insecure_network_communication
      severity: "moderate"
      relative_impacts:
        - subrule_id: optimal_https
          factor: "moderate"
        - subrule_id: strong_transmission_security
          factor: "moderate"
        - subrule_id: weakest_transmission_security
          factor: "minor"
  severity: 0
  weight: 1
  score: 5

- id: weakest_transmission_security
  description: >-
    Ensures encrypted data transmission.
  type: RegexAnd
  pattern:
    - (?i)SSL
    - RC4
    - (?i)http://
  vulnerability_impacts:
    - vulnerability_id: insecure_network_communication
      severity: "negligible"
      relative_impacts: []
  severity: 0
  weight: 1
  score: 5
