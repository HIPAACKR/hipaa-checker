- id: authorization_exception_on_destroy
  description: >-
    This Application implements authorization to destroy sensitive resources.
  type: RegexAnd
  pattern:
    - PermissionDenied
    - PermissionRequiredMixin
  vulnerability_impacts:
    - vulnerability_id: inadequate_data_security
      severity: "strong"
      relative_impacts:
        - subrule_id: authorization
          factor: "optimal"
        - subrule_id: authorization_for_data
          factor: "moderate"
  severity: warning
