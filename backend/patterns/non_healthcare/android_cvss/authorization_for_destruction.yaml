- id: authorization_exception_for_destruction
  description: >-
    This Application implements authorization to destroy sensitive resources.
  type: RegexAnd
  pattern:
    - AuthorizationException
  vulnerability_impacts:
    - vulnerability_id: inadequate_data_security
      severity: "moderate"
      relative_impacts: []

  severity: 0
  weight: 1
  score: 2.5
- id: illegal_destruction_restriction
  description: >-
    This Application restricts illegal destruction to sensitive resources.
  type: RegexAnd
  pattern:
    - IllegalAccessException
  vulnerability_impacts:
    - vulnerability_id: inadequate_data_security
      severity: "moderate"
      relative_impacts: []
  severity: 0
  weight: 1
  score: 2.5

- id: authorization_enforcement_for_destruction
  description: >-
    This Application detects explicit authorization enforcement by throwing a Security Exception when unauthorized access occurs.
  type: RegexAnd
  pattern:
    - SecurityException
  vulnerability_impacts:
    - vulnerability_id: inadequate_data_security
      severity: "moderate"
      relative_impacts: []
  severity: 0
  weight: 1
  score: 5

- id: access_control_exception_for_destruction
  description: >-
    This Application identifies cases where access control is applied, preventing unauthorized operations using AccessControlException.
  type: RegexAnd
  pattern:
    - AccessControlException
  vulnerability_impacts:
    - vulnerability_id: inadequate_data_security
      severity: "moderate"
      relative_impacts: []
  severity: 0
  weight: 1
  score: 5

- id: biometric_authentication_for_destruction
  description: >-
    This app checks standard authentication via biometric information.
  type: RegexAnd
  pattern:
    - USE_BIOMETRIC
    - USE_FINGERPRINT
    - (BiometricPrompt|BiometricManager)\.?[A-Za-z]*
    - BiometricManager\.(BIOMETRIC_SUCCESS|BIOMETRIC_ERROR_|BIOMETRIC_STRONG|BIOMETRIC_WEAK)
    - BiometricPrompt\s*\(|authenticate\(promptInfo\)
    - KeyGenParameterSpec\.Builder.*setUserAuthenticationRequired\(true\)
    - setDeviceCredentialAllowed\(true\)
    - FingerprintManager\.?[A-Za-z]*|FingerprintManagerCompat

  vulnerability_impacts:
    - vulnerability_id: inadequate_data_security
      severity: "moderate"
      relative_impacts: []
  severity: 0
  weight: 1
  score: 5